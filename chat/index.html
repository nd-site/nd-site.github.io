<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatND - ND Labs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

    <!-- KaTeX & Marked.js for Math & Markdown -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="/chat/chat.css">
    <script src="/assets/js/nd-navbar.js" defer></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/cloudflare-storage.js"></script>
    <script src="/assets/js/nd-chat-core.js"></script>
    <script src="/assets/js/firebase-init.js" type="module"></script>
    <script src="/font/font.js"></script>

    <style>
        .chat-media-preview-box {
            padding: 8px 12px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .media-tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #0369a1;
            background: #e0f2fe;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .msg-file-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            padding: 10px 14px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #1e293b;
        }

        .msg-file-download-btn {
            background: #0284c7;
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .msg-file-download-btn:hover {
            background: #0369a1;
        }

        .msg-img-preview {
            max-width: 280px;
            max-height: 240px;
            border-radius: 14px;
            object-fit: cover;
            margin-top: 6px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .msg-video-player {
            max-width: 320px;
            border-radius: 14px;
            margin-top: 6px;
        }

        .msg-audio-player {
            width: 260px;
            margin-top: 6px;
        }

        .sidebar-tabs-row {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-top: 10px;
            gap: 4px;
        }

        .sidebar-tab-btn {
            flex: 1;
            padding: 6px 10px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .sidebar-tab-btn.active {
            background: #fff;
            color: #0284c7;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body>
    <div id="chat-app" class="chat-app-wrapper">
        <!-- Sidebar -->
        <aside id="chat-sidebar" class="chat-sidebar">
            <div class="sidebar-header">
                <div class="user-profile-bar">
                    <div class="user-info-mini">
                        <img id="my-avatar" src="/assets/images/logo.png" alt="Avatar" onerror="this.src='/assets/images/logo.png'">
                        <div class="user-details-mini">
                            <h4 id="my-name">ND Member</h4>
                            <p id="my-ndid">ndid</p>
                        </div>
                    </div>
                </div>

                <div class="search-box-rel">
                    <i class="ph-bold ph-magnifying-glass"></i>
                    <input type="text" id="search-ndid-input" class="search-input" placeholder="Tìm theo tên, NDID hoặc CodeID..." autocomplete="off">
                    <div id="search-results-overlay" class="search-results-overlay"></div>
                </div>

                <!-- Tabs: Trò chuyện cá nhân & Nhóm chat -->
                <div class="sidebar-tabs-row">
                    <button type="button" id="tab-btn-direct" class="sidebar-tab-btn active">
                        <i class="ph-bold ph-user"></i> Cá nhân
                    </button>
                    <button type="button" id="tab-btn-groups" class="sidebar-tab-btn">
                        <i class="ph-bold ph-users-three"></i> Nhóm chat
                    </button>
                </div>
            </div>

            <!-- Active Conversations List -->
            <div id="conversations-list" class="conversations-list">
                <div class="chat-placeholder-info">Đang tải danh sách trò chuyện...</div>
            </div>

            <!-- Groups List Container -->
            <div id="groups-list" class="conversations-list hidden">
                <div style="padding: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 12px; font-weight: 800; color: #475569;">NHÓM TRÒ CHUYỆN</span>
                    <button type="button" id="btn-create-group" style="padding: 4px 10px; background: #0284c7; color: #fff; border-radius: 8px; font-size: 11px; font-weight: 700; border: none; cursor: pointer;">
                        + Tạo nhóm
                    </button>
                </div>
                <div id="group-items-container">
                    <div class="chat-placeholder-info">Đang tải nhóm chat...</div>
                </div>
            </div>
        </aside>

        <!-- Resizable Divider Bar -->
        <div id="chat-resizer" class="chat-resizer" title="Kéo để điều chỉnh kích thước"></div>

        <!-- Main Chat Panel -->
        <main class="chat-main-panel">
            <!-- Empty State when no conversation selected -->
            <div id="chat-empty-state" class="chat-empty-state">
                <div class="chat-empty-icon">
                    <i class="ph-duotone ph-chat-circle-dots"></i>
                </div>
                <h3>Chào mừng đến với ChatND by ND Labs</h3>
                <p>Nhắn tin trực tiếp với <strong>Admin @nhatdang</strong>, tham gia <strong>Nhóm chat</strong> hoặc gửi tệp tin đa phương tiện chất lượng cao.</p>
            </div>

            <!-- Active Chat Interface -->
            <div id="active-chat-wrapper" class="active-chat-wrapper hidden">
                <header class="chat-header">
                    <div class="chat-header-user">
                        <button id="mobile-back-btn" class="mobile-back-btn" title="Quay lại">
                            <i class="ph-bold ph-arrow-left"></i>
                        </button>
                        <img id="active-contact-avatar" src="/assets/images/logo.png" alt="Avatar" class="chat-header-avatar" onerror="this.src='/assets/images/logo.png'">
                        <div>
                            <div id="active-contact-name" class="chat-header-title">Người dùng</div>
                            <div id="active-contact-ndid" class="chat-header-sub">ndid</div>
                        </div>
                    </div>
                    <button id="delete-conv-btn" class="delete-conv-btn" title="Xóa đoạn chat này">
                        <i class="ph-bold ph-trash"></i>
                    </button>
                </header>

                <!-- Messages Container -->
                <div id="messages-container" class="messages-container"></div>

                <!-- Attachment Pending Bar -->
                <div id="attachment-preview-bar" class="chat-media-preview-box hidden">
                    <div class="media-tag-chip">
                        <i id="preview-file-icon" class="ph-bold ph-file"></i>
                        <span id="preview-file-name">file.png</span>
                        <span id="preview-file-size" style="opacity: 0.7; font-size: 11px;">(0 KB)</span>
                    </div>
                    <button type="button" id="btn-cancel-attachment" style="background: none; border: none; color: #ef4444; font-weight: 800; cursor: pointer;">✕</button>
                </div>

                <!-- Input Form -->
                <form id="chat-input-form" class="chat-input-bar">
                    <label for="chat-file-input" class="btn-attach-file" title="Gửi hình ảnh, video, âm thanh, tệp tin...">
                        <i class="ph-bold ph-paperclip" style="font-size: 20px; color: #64748b; cursor: pointer;"></i>
                    </label>
                    <input type="file" id="chat-file-input" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar">

                    <input type="text" id="message-text-input" class="chat-message-input" placeholder="Nhập tin nhắn..." autocomplete="off">
                    <button type="submit" id="btn-send-message" class="btn-send-message">
                        <span>Gửi</span>
                        <i class="ph-bold ph-paper-plane-right"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Create Group Modal -->
    <div id="create-group-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: #fff; max-width: 440px; width: 100%; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 16px; font-weight: 800; color: #0f172a; margin: 0;">Tạo Nhóm Trò Chuyện Mới</h3>
                <button type="button" id="close-create-group-modal" style="border: none; background: none; font-size: 18px; cursor: pointer; color: #94a3b8;">✕</button>
            </div>
            <form id="create-group-form" style="display: flex; flex-direction: column; gap: 14px;">
                <div>
                    <label style="font-size: 12px; font-weight: 700; color: #334155;">Tên nhóm chat *</label>
                    <input type="text" id="new-group-name" required placeholder="Ví dụ: Hội Học Tập Toán 10" style="width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-family: inherit; font-size: 13px; margin-top: 4px; box-sizing: border-box;">
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 700; color: #334155;">Mô tả nhóm</label>
                    <input type="text" id="new-group-desc" placeholder="Giới thiệu mục đích nhóm..." style="width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-family: inherit; font-size: 13px; margin-top: 4px; box-sizing: border-box;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer;">
                        <input type="checkbox" id="new-group-public" checked style="accent-color: #0284c7;">
                        <span>Công khai</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer;">
                        <input type="checkbox" id="new-group-approval" style="accent-color: #0284c7;">
                        <span>Cần duyệt khi vào</span>
                    </label>
                </div>
                <button type="submit" style="background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 6px;">
                    Tạo Nhóm Ngay
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy, onSnapshot, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getDatabase, ref as rRef, onValue as rOnValue, push as rPush, set as rSet } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        let app = getApps().length > 0 ? getApp() : null;
        let auth = app ? getAuth(app) : null;
        let db = app ? getFirestore(app) : null;
        let rdb = app ? getDatabase(app) : null;

        let currentUser = null;
        let currentUserNdid = '';
        let currentUserCodeId = '';
        let activeContact = null;
        let activeChatId = null;
        let activeGroupRoom = null;
        let selectedAttachmentFile = null;
        let unsubscribeMessages = null;
        let unsubscribeConversations = null;

        // Elements
        const myAvatar = document.getElementById('my-avatar');
        const myName = document.getElementById('my-name');
        const myNdid = document.getElementById('my-ndid');
        const convsListEl = document.getElementById('conversations-list');
        const groupsListEl = document.getElementById('groups-list');
        const groupItemsContainer = document.getElementById('group-items-container');
        const tabBtnDirect = document.getElementById('tab-btn-direct');
        const tabBtnGroups = document.getElementById('tab-btn-groups');
        const chatEmptyState = document.getElementById('chat-empty-state');
        const activeChatWrapper = document.getElementById('active-chat-wrapper');
        const activeAvatar = document.getElementById('active-contact-avatar');
        const activeName = document.getElementById('active-contact-name');
        const activeNdid = document.getElementById('active-contact-ndid');
        const messagesContainer = document.getElementById('messages-container');
        const chatInputForm = document.getElementById('chat-input-form');
        const messageInput = document.getElementById('message-text-input');
        const fileInput = document.getElementById('chat-file-input');
        const attachmentPreviewBar = document.getElementById('attachment-preview-bar');
        const previewFileName = document.getElementById('preview-file-name');
        const previewFileSize = document.getElementById('preview-file-size');
        const previewFileIcon = document.getElementById('preview-file-icon');
        const btnCancelAttachment = document.getElementById('btn-cancel-attachment');

        // Tab Switching
        tabBtnDirect.addEventListener('click', () => {
            tabBtnDirect.classList.add('active');
            tabBtnGroups.classList.remove('active');
            convsListEl.classList.remove('hidden');
            groupsListEl.classList.add('hidden');
        });

        tabBtnGroups.addEventListener('click', () => {
            tabBtnGroups.classList.add('active');
            tabBtnDirect.classList.remove('active');
            groupsListEl.classList.remove('hidden');
            convsListEl.classList.add('hidden');
            loadGroupsList();
        });

        // File attachment handler
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            selectedAttachmentFile = file;
            const category = window.NDChatCore ? window.NDChatCore.getFileCategory(file.type, file.name) : 'document';
            
            previewFileName.textContent = file.name;
            previewFileSize.textContent = `(${window.NDChatCore ? window.NDChatCore.formatBytes(file.size) : file.size + ' B'})`;
            
            if (category === 'image') previewFileIcon.className = 'ph-bold ph-image';
            else if (category === 'video') previewFileIcon.className = 'ph-bold ph-video';
            else if (category === 'audio') previewFileIcon.className = 'ph-bold ph-speaker-high';
            else previewFileIcon.className = 'ph-bold ph-file';

            attachmentPreviewBar.classList.remove('hidden');
        });

        btnCancelAttachment.addEventListener('click', () => {
            selectedAttachmentFile = null;
            fileInput.value = '';
            attachmentPreviewBar.classList.add('hidden');
        });

        // Check direct URL param: /chat?<NDID> or /chat?u=<NDID>
        function checkDirectUrlRouting() {
            const search = window.location.search;
            if (!search || search === '?') return;

            let targetNdid = '';
            if (search.includes('=')) {
                const params = new URLSearchParams(search);
                targetNdid = params.get('u') || params.get('id') || params.get('ndid') || '';
            } else {
                targetNdid = search.substring(1);
            }

            if (targetNdid) {
                targetNdid = targetNdid.replace(/^@/, '').toLowerCase();
                if (targetNdid === 'nhatdang' || targetNdid === 'admin') {
                    selectConversation({
                        codeId: '00000000',
                        ndid: 'nhatdang',
                        name: 'Nhật Đăng (Admin)',
                        avatar: '/assets/images/logo.png',
                        isAdmin: true
                    });
                } else {
                    // Find user in Firestore
                    getDocs(query(collection(db, 'users'), where('ndid', '==', targetNdid))).then(snap => {
                        if (!snap.empty) {
                            const u = snap.docs[0].data();
                            selectConversation({
                                uid: snap.docs[0].id,
                                codeId: u.codeId || '',
                                ndid: u.ndid || targetNdid,
                                name: u.fullname || u.displayName || 'ND Member',
                                avatar: u.photoURL || '/assets/images/logo.png'
                            });
                        }
                    }).catch(() => {});
                }
            }
        }

        // Initialize Firebase services and state
        window.addEventListener('firebase-ready', () => {
            if (window.firebaseAuth && window.firebaseFirestore) {
                auth = window.firebaseAuth;
                db = window.firebaseFirestore;
                rdb = window.firebaseDb;

                onAuthStateChanged(auth, async (user) => {
                    if (!user) {
                        window.location.href = '/auth/login/';
                        return;
                    }
                    currentUser = user;

                    const cached = JSON.parse(localStorage.getItem('nd_user') || '{}');
                    currentUserNdid = cached.ndid || user.displayName || user.uid;
                    currentUserCodeId = cached.codeId || '';

                    myAvatar.src = user.photoURL || cached.photoURL || '/assets/images/logo.png';
                    myName.textContent = user.displayName || cached.displayName || 'ND Member';
                    myNdid.innerHTML = `${currentUserNdid}${currentUserCodeId ? `<div style="font-size:11px;color:#94a3b8;margin-top:2px;">CodeID: ${currentUserCodeId}</div>` : ''}`;

                    // Fetch Firestore user doc
                    try {
                        const snap = await getDoc(doc(db, 'users', user.uid));
                        if (snap.exists()) {
                            const d = snap.data();
                            currentUserNdid = d.ndid || currentUserNdid;
                            currentUserCodeId = d.codeId || currentUserCodeId;
                            myNdid.innerHTML = `${currentUserNdid} <div style="font-size:11px;color:#94a3b8;margin-top:2px;">CodeID: ${currentUserCodeId}</div>`;
                        }
                    } catch (_) {}

                    loadDirectConversations();
                    checkDirectUrlRouting();
                });
            }
        });

        // Load Direct Conversations
        function loadDirectConversations() {
            if (unsubscribeConversations) unsubscribeConversations();
            if (!currentUserCodeId) return;

            const q = query(
                collection(db, 'chats'),
                where('participants', 'array-contains', currentUserCodeId)
            );

            unsubscribeConversations = onSnapshot(q, (snapshot) => {
                let list = [];
                snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));

                let html = '';

                // Admin Nhật Đăng Pinned item
                const adminChatId = `chat_${[currentUserCodeId, '00000000'].sort().join('_')}`;
                const isAdminActive = activeChatId === adminChatId;

                html += `
                    <div class="conv-item pinned admin-pinned ${isAdminActive ? 'active' : ''}" data-codeid="00000000" data-ndid="nhatdang" data-name="Nhật Đăng (Admin)" data-avatar="/assets/images/logo.png">
                        <div class="conv-avatar-rel">
                            <img src="/assets/images/logo.png" alt="Admin">
                        </div>
                        <div class="conv-details">
                            <div class="conv-top-row">
                                <span class="conv-name">Nhật Đăng <span class="pinned-tag admin-badge">🛡️ Admin</span></span>
                                <span class="conv-time">📌 Ghim</span>
                            </div>
                            <div class="conv-last-msg">Nhắn tin trực tiếp tới Admin ND Labs</div>
                        </div>
                    </div>
                `;

                // Render other direct messages
                list.forEach(conv => {
                    const otherCodeId = conv.participants.find(id => id !== currentUserCodeId) || currentUserCodeId;
                    if (otherCodeId === '00000000') return;

                    const d = conv.participantDetails?.[otherCodeId] || {};
                    const isSel = activeChatId === conv.id;

                    html += `
                        <div class="conv-item ${isSel ? 'active' : ''}" data-chat-id="${conv.id}" data-codeid="${otherCodeId}" data-ndid="${d.ndid || 'ndid'}" data-name="${d.name || 'Thành viên'}" data-avatar="${d.avatar || '/assets/images/logo.png'}">
                            <div class="conv-avatar-rel">
                                <img src="${d.avatar || '/assets/images/logo.png'}" alt="">
                            </div>
                            <div class="conv-details">
                                <div class="conv-top-row">
                                    <span class="conv-name">${d.name || 'Thành viên'}</span>
                                </div>
                                <div class="conv-last-msg">${conv.lastMessage || 'Bắt đầu trò chuyện...'}</div>
                            </div>
                        </div>
                    `;
                });

                convsListEl.innerHTML = html;

                convsListEl.querySelectorAll('.conv-item').forEach(item => {
                    item.addEventListener('click', () => {
                        selectConversation({
                            codeId: item.dataset.codeid,
                            ndid: item.dataset.ndid,
                            name: item.dataset.name,
                            avatar: item.dataset.avatar,
                            isAdmin: item.dataset.codeid === '00000000'
                        });
                    });
                });
            });
        }

        // Load Group Conversations (Realtime Database)
        function loadGroupsList() {
            if (!rdb) return;
            rOnValue(rRef(rdb, 'chatnd_groups'), (snap) => {
                if (!snap.exists()) {
                    groupItemsContainer.innerHTML = `<div class="chat-placeholder-info">Chưa có nhóm chat nào. Hãy tạo nhóm đầu tiên!</div>`;
                    return;
                }
                const data = snap.val();
                let html = '';
                Object.keys(data).forEach(gId => {
                    const g = data[gId];
                    const isMember = g.members && currentUser && g.members[currentUser.uid];
                    html += `
                        <div class="conv-item" data-group-id="${gId}">
                            <div class="conv-avatar-rel">
                                <div style="width: 44px; height: 44px; border-radius: 12px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 20px;">👥</div>
                            </div>
                            <div class="conv-details">
                                <div class="conv-top-row">
                                    <span class="conv-name">${g.name}</span>
                                    <span style="font-size: 10px; color: ${isMember ? '#16a34a' : '#64748b'}; font-weight: 700;">${isMember ? 'Đã vào' : (g.isPublic ? 'Công khai' : 'Riêng tư')}</span>
                                </div>
                                <div class="conv-last-msg">${g.description || 'Nhóm trò chuyện cộng đồng'}</div>
                            </div>
                        </div>
                    `;
                });
                groupItemsContainer.innerHTML = html;

                groupItemsContainer.querySelectorAll('.conv-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const gId = item.dataset.groupId;
                        const g = data[gId];
                        selectGroupConversation(gId, g);
                    });
                });
            });
        }

        function selectConversation(contact) {
            activeContact = contact;
            activeGroupRoom = null;

            activeChatId = `chat_${[currentUserCodeId, contact.codeId].sort().join('_')}`;

            activeName.textContent = contact.name;
            activeNdid.textContent = `NDID: ${contact.ndid} (CodeID: ${contact.codeId})`;
            activeAvatar.src = contact.avatar;

            chatEmptyState.style.display = 'none';
            activeChatWrapper.classList.remove('hidden');
            document.getElementById('chat-app').classList.add('mobile-active-chat');

            subscribeDirectMessages(activeChatId);
        }

        function selectGroupConversation(groupId, groupData) {
            activeGroupRoom = { id: groupId, ...groupData };
            activeContact = null;
            activeChatId = null;

            activeName.textContent = groupData.name;
            activeNdid.textContent = `Nhóm chat • ${Object.keys(groupData.members || {}).length} thành viên`;
            activeAvatar.src = '/assets/images/logo.png';

            chatEmptyState.style.display = 'none';
            activeChatWrapper.classList.remove('hidden');
            document.getElementById('chat-app').classList.add('mobile-active-chat');

            subscribeGroupMessages(groupId);
        }

        // Mobile back button event
        const mobileBackBtn = document.getElementById('mobile-back-btn');
        if (mobileBackBtn) {
            mobileBackBtn.addEventListener('click', () => {
                document.getElementById('chat-app').classList.remove('mobile-active-chat');
            });
        }

        function renderFileInMessage(file) {
            if (!file || !file.url) return '';
            if (file.category === 'image') {
                return `<a href="${file.url}" target="_blank"><img src="${file.url}" class="msg-img-preview" alt="Image"></a>`;
            }
            if (file.category === 'video') {
                return `<video src="${file.url}" controls class="msg-video-player"></video>`;
            }
            if (file.category === 'audio') {
                return `<audio src="${file.url}" controls class="msg-audio-player"></audio>`;
            }
            return `
                <div class="msg-file-card">
                    <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
                        <i class="ph-bold ph-file-text" style="font-size: 24px; color: #0284c7; flex-shrink: 0;"></i>
                        <div style="min-width: 0;">
                            <div style="font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${file.name}</div>
                            <div style="font-size: 10.5px; color: #64748b;">${file.sizeFormatted || ''}</div>
                        </div>
                    </div>
                    <a href="${file.url}" download="${file.name}" target="_blank" class="msg-file-download-btn">
                        <i class="ph-bold ph-download-simple"></i> Tải về
                    </a>
                </div>
            `;
        }

        function subscribeDirectMessages(chatId) {
            if (unsubscribeMessages) unsubscribeMessages();
            messagesContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Đang tải tin nhắn...</div>';

            const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'));
            unsubscribeMessages = onSnapshot(q, (snap) => {
                if (snap.empty) {
                    messagesContainer.innerHTML = '<div style="padding: 40px; text-align: center; color: #94a3b8;">Chưa có tin nhắn nào. Hãy gửi lời chào! 👋</div>';
                    return;
                }

                let html = '';
                snap.forEach(docSnap => {
                    const m = docSnap.data();
                    const isSent = m.senderUid === currentUser.uid;
                    html += `
                        <div class="msg-row ${isSent ? 'sent' : 'received'}">
                            <div class="msg-bubble ${isSent ? 'msg-bubble-sent' : 'msg-bubble-received'}">
                                ${m.text ? `<div>${m.text}</div>` : ''}
                                ${renderFileInMessage(m.file)}
                            </div>
                        </div>
                    `;
                });
                messagesContainer.innerHTML = html;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function subscribeGroupMessages(groupId) {
            if (unsubscribeMessages) unsubscribeMessages();
            messagesContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Đang tải tin nhắn nhóm...</div>';

            rOnValue(rRef(rdb, `chatnd_messages/${groupId}`), (snap) => {
                if (!snap.exists()) {
                    messagesContainer.innerHTML = '<div style="padding: 40px; text-align: center; color: #94a3b8;">Chưa có tin nhắn trong nhóm. Hãy gửi tin nhắn đầu tiên!</div>';
                    return;
                }
                const data = snap.val();
                let html = '';
                Object.keys(data).forEach(mId => {
                    const m = data[mId];
                    const isSent = m.senderId === currentUser?.uid;
                    html += `
                        <div class="msg-row ${isSent ? 'sent' : 'received'}">
                            <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 2px;">${m.senderName || 'Thành viên'}</div>
                            <div class="msg-bubble ${isSent ? 'msg-bubble-sent' : 'msg-bubble-received'}">
                                ${m.text ? `<div>${m.text}</div>` : ''}
                                ${renderFileInMessage(m.file)}
                            </div>
                        </div>
                    `;
                });
                messagesContainer.innerHTML = html;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // Send Message Form Submit
        chatInputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = selectedAttachmentFile;
            if (!text && !file) return;

            messageInput.value = '';
            selectedAttachmentFile = null;
            attachmentPreviewBar.classList.add('hidden');

            const senderInfo = {
                uid: currentUser.uid,
                codeId: currentUserCodeId,
                ndid: currentUserNdid,
                displayName: currentUser.displayName || 'ND Member',
                photoURL: currentUser.photoURL || '/assets/images/logo.png'
            };

            try {
                if (activeGroupRoom && rdb) {
                    await window.NDChatCore.sendGroupMessage(rdb, 'chatnd', activeGroupRoom.id, senderInfo, text, file);
                } else if (activeContact && db) {
                    await window.NDChatCore.sendDirectMessage(db, senderInfo, activeContact, text, file);
                }
            } catch (err) {
                alert('Lỗi gửi tin nhắn: ' + err.message);
            }
        });

        // Group creation modal
        const createGroupModal = document.getElementById('create-group-modal');
        document.getElementById('btn-create-group').onclick = () => {
            createGroupModal.classList.remove('hidden');
        };
        document.getElementById('close-create-group-modal').onclick = () => {
            createGroupModal.classList.add('hidden');
        };

        document.getElementById('create-group-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('new-group-name').value.trim();
            const desc = document.getElementById('new-group-desc').value.trim();
            const isPublic = document.getElementById('new-group-public').checked;
            const requireApproval = document.getElementById('new-group-approval').checked;

            if (!name || !rdb || !currentUser) return;

            const newGroupRef = rPush(rRef(rdb, 'chatnd_groups'));
            const payload = {
                name,
                description: desc,
                isPublic,
                requireApproval,
                createdBy: currentUser.uid,
                createdAt: Date.now(),
                members: {
                    [currentUser.uid]: {
                        role: 'owner',
                        name: currentUser.displayName || 'Chủ nhóm',
                        joinedAt: Date.now()
                    }
                }
            };

            await rSet(newGroupRef, payload);
            createGroupModal.classList.add('hidden');
            loadGroupsList();
        });
    </script>
</body>

</html>
