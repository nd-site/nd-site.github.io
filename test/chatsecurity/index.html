<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Chat</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; display:flex; flex-direction:column; height:100vh;}
    #messages {flex:1; overflow-y:auto; padding:10px; border-bottom:1px solid #ddd;}
    #form {display:flex; padding:10px; background:#f9f9f9;}
    #input {flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;}
    #send {margin-left:5px; padding:8px 12px; background:#0284c7; color:#fff; border:none; border-radius:4px; cursor:pointer;}
    .msg {margin-bottom:8px;}
    .msg span {font-weight:700;}
  </style>
</head>
<body>
  <div id="messages"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Enter message..." />
    <button id="send" type="submit">Send</button>
  </form>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat message', text);
      addMessage('You', text);
      input.value = '';
    });

    socket.on('chat message', msg => {
      addMessage('Other', msg);
    });

    function addMessage(sender, text) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<span>${sender}:</span> ${escapeHtml(text)}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>\"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[tag]||tag));
    }
  </script>
</body>
</html>
