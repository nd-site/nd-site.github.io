<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập NDID - ND Labs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="/auth/auth.css">
    <script src="/assets/js/nd-accounts.js"></script>
    <script src="/assets/js/nd-navbar.js" defer></script>
    <script src="/assets/js/config.js"></script>
    <script type="module" src="/assets/js/firebase-init.js"></script>
    <script src="/assets/js/canonical-auth.js"></script>
    <script src="/font/font.js"></script>
    <style>
        .forgot-link-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .forgot-link {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .add-account-banner {
            background: #f0fdf4;
            border: 1.5px solid #86efac;
            color: #166534;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/assets/images/logo.png" alt="ND Labs" class="auth-logo">
                <h1>Đăng nhập NDID</h1>
                <p>Nền tảng dịch vụ số ND Labs</p>
            </div>

            <!-- Add Account Mode Notice -->
            <div id="add-account-notice" class="add-account-banner hidden">
                <i class="ph-bold ph-user-plus" style="font-size: 16px;"></i>
                <span>Đang thêm tài khoản mới (Hệ thống hỗ trợ tối đa 10 tài khoản)</span>
            </div>

            <!-- Form: Login via Canonical Auth -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="ndid">Tài khoản *</label>
                    <div class="input-container">
                        <i class="ph-duotone ph-user-circle"></i>
                        <input type="text" id="ndid" placeholder="Nhập NDID hoặc Email" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu *</label>
                    <div class="input-container">
                        <i class="ph-duotone ph-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <div class="forgot-link-container">
                        <a href="/auth/recovery/" id="forgot-password-link" class="forgot-link">Quên mật khẩu?</a>
                    </div>
                </div>

                <button type="submit" id="submit-pwd-btn" class="btn-primary">
                    <span>Đăng nhập</span>
                    <i class="ph-bold ph-arrow-right"></i>
                </button>

                <div class="divider"><span>Hoặc</span></div>

                <button type="button" id="google-btn" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    <span>Đăng nhập với Google</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Chưa có tài khoản? <a href="/auth/register/">Tạo NDID ngay</a></p>
            </div>
        </div>
    </div>


    <div id="status-msg" class="status-msg"></div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithPopup = signInWithPopup;

        const isAddingAccount = new URLSearchParams(window.location.search).get('addAccount') === 'true';
        if (isAddingAccount) {
            document.getElementById('add-account-notice').classList.remove('hidden');
        }

        const statusEl = document.getElementById('status-msg');
        function showStatus(text, type = 'info') {
            statusEl.textContent = text;
            statusEl.className = `status-msg show ${type}`;
            setTimeout(() => statusEl.className = 'status-msg', 4000);
        }

        const loginForm = document.getElementById('login-form');

        // 1. Password Login Submit (Canonical Authentication)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('ndid').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-pwd-btn');

            if (!identifier || !password) {
                showStatus('Vui lòng nhập đầy đủ tên tài khoản và mật khẩu.', 'error');
                return;
            }

            if (!window.canonicalAuth) {
                showStatus('Hệ thống xác thực đang khởi động, vui lòng thử lại sau giây lát.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang xác thực...</span>';

            try {
                await window.canonicalAuth.login({
                    identifier,
                    password,
                });

                showStatus('Đăng nhập thành công!', 'success');
                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    const redirectUrl = params.get('redirect');
                    if (redirectUrl && !redirectUrl.startsWith('http://') && !redirectUrl.startsWith('https://')) {
                        window.location.href = decodeURIComponent(redirectUrl);
                    } else {
                        window.location.href = '/';
                    }
                }, 600);
            } catch (err) {
                const message = window.canonicalAuth.mapError(err);
                showStatus(message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng nhập</span><i class="ph-bold ph-arrow-right"></i>';
            }
        });

        // 2. Google Login (Canonical Identity Resolution)
        const googleBtn = document.getElementById('google-btn');
        googleBtn.addEventListener('click', async () => {
            if (!window.canonicalAuth) {
                showStatus('Hệ thống xác thực chưa sẵn sàng.', 'error');
                return;
            }
            googleBtn.disabled = true;
            const originalContent = googleBtn.innerHTML;
            googleBtn.innerHTML = '<span>Đang xác thực Google...</span>';

            try {
                await window.canonicalAuth.loginWithGoogle();
                showStatus('Đăng nhập thành công!', 'success');
                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    const redirectUrl = params.get('redirect');
                    if (redirectUrl && !redirectUrl.startsWith('http://') && !redirectUrl.startsWith('https://')) {
                        window.location.href = decodeURIComponent(redirectUrl);
                    } else {
                        window.location.href = '/';
                    }
                }, 600);
            } catch (err) {
                const message = window.canonicalAuth.mapError(err);
                showStatus(message, 'error');
                googleBtn.disabled = false;
                googleBtn.innerHTML = originalContent;
            }
        });
    </script>
</body>

</html>
