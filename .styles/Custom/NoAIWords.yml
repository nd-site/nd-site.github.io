extends: existence
message: "Phát hiện từ ngữ/cụm từ mang văn phong AI hoặc ghi chú thừa: '%s'. Hãy đổi sang từ ngữ tự nhiên hoặc xóa bỏ phần giải thích trong ngoặc!"
level: warning
ignorecase: true
tokens:
