  - "\\(thỏi trong game\\)"
  - "\\(trong game\\)"
  - "\\(mặc định\\)"
  - "\\(lưu ý:"
  - "\\(chú thích:"
  - "\\(ví dụ:"
  - "đây là"
  - "dưới đây là"
  - "danh sách các"
  - "bạn có thể"
  - "vui lòng lưu ý"
  - "vui lòng chọn"
  - "nhấp vào đây để"

